<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>__MSG_appName__</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>__MSG_loginTitle__</h1>

  <table>
    <tbody>
      <tr>
        <th>
          <label for="domain">__MSG_serverDomain__</label>
        </th>
        <td>
          <input id="domain" type="text" placeholder="cloud.example.com">
        </td>
      </tr>
    </tbody>
  </table>

  <details id="advancedSettings">
    <summary>__MSG_advancedSettings__</summary>

    <label class="advanced-toggle-row" for="useInstanceName">
      <span class="advanced-toggle-label">__MSG_useNameFromNextcloudInstance__</span>
      <span class="switch" aria-hidden="true">
        <input id="useInstanceName" type="checkbox" checked>
        <span class="slider"></span>
      </span>
    </label>

    <div id="nameOverrideRow">
      <table>
        <tbody>
          <tr>
            <th>
              <label for="name">__MSG_nameLabel__</label>
            </th>
            <td>
              <input id="name" type="text" value="Nextcloud">
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </details>

  <details id="expander">
    <summary>__MSG_useUsernamePassword__</summary>
    <table>
      <tbody>
        <tr>
          <th>
            <label for="username">__MSG_username__</label></th>
          <td>
            <input id="username" type="text">
          </td>
        </tr>
        <tr>
          <th>
            <label for="password">__MSG_password__</label></th>
          <td>
            <input id="password" type="password">
          </td>
        </tr>
      </tbody>
    </table>
  </details>

  <div class="row">
    <span id="message"></span>
    <button id="btnOk">__MSG_login__</button>
  </div>

  <script type="module" src="node_modules/webextension-polyfill/dist/browser-polyfill.min.js"></script>
  <script type="text/javascript" src="window.js"></script>
</body>
</html>
